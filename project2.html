<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>job application</title>
    <link rel="stylesheet" href="style2.css">
<body>
    <div class="container">
        <div class="apply_box">
            <h1>JOB APPLICATION (Web)</h1>
            <form>
                <div class="form">
                    <div class="form_control">
                        <label for="first_name">
                            First name
                        </label>
                        <input type="text" id="first_name"
                        name="first_name" placeholder="enter first name">
                    </div>
                    <div class="form_control">
                        <label for="last_name">
                            last name
                        </label>
                        <input type="text" id="last_name"
                        name="last_name" placeholder="enter last name">
                    </div>
                    <div class="form_control">
                        <label for="email">
                            Email
                        </label>
                        <input type="email" id="email"
                        name="email" placeholder="enter your email">
                    </div>
                    <div class="form_control">
                        <label for="job_role">
                            Email
                        </label>
                        <select id="">
                            <option value="">select Job Role</option>
                            <option value="Frontend">Frontend Developer</option>
                            <option value="Backend"> Backend Developer</option>
                            <option value="full_stack">Full Stack Developer</option>
                            <option value="ui_ux">UI UX Designer</option>

                        </select>
                        </div>

                        <div class="address_control">
                            <label for="address">
                            Address
                            </label>
                            <textarea id="address" name="address" row="4" cols="50" placeholder="enter address"></textarea>
                        </div> 
                        <div class="form_control">
                        <label for="city">
                            City
                        </label>
                        <input type="text" id="city"
                        name="city" placeholder="enter your city">
                    </div>
                    <div class="form_control">
                        <label for="pincode">
                            Pincode
                        </label>
                        <input type="number" id="pincode"
                        name="pincode" placeholder="enter your pincode">
                    </div> 
                    <div class="form_control">
                        <label for="date">
                            Date
                        </label>
                        <input type="date" id="date"
                        name="date" >
                    </div> 
                    <div class="form_control">
                        <label for="selectfile">
                            Date
                        </label>
                        <input type="file" id="selectfile"
                        name="selectfile" >
                    </div>                   
                    </div>
                    <div class="button_ctn">
                        <button type="submit">Apply Now</button>
                    </div>
                </form>
            </div>
        </div>
</body>
</html>
